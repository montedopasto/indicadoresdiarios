name: Atualizar resumo BoviTrack

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-bovitrack-summary
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Recalcular dados agregados
        run: node scripts/update-bovitrack-summary.mjs
      - name: Publicar apenas quando existirem alterações
        run: |
          if git diff --quiet -- data/bovitrack-summary.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bovitrack-summary.json
          git commit -m "Atualizar resumo BoviTrack"
          git push
